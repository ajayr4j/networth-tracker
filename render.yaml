services:
  - type: web
    name: networth-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: networth-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://networth-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://networth-app.netlify.app
      - key: DATABASE_URL
        fromDatabase:
          name: networth-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.10.12"

databases:
  - name: networth-db
    plan: free
    databaseName: networth
    user: networth
