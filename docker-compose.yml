services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-networth}
      POSTGRES_USER: ${POSTGRES_USER:-networth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-networth}
    ports:
      - "5437:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networth}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
